name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Repository variables (Settings > Variables). The Sanity client throws at import time
      # when these are empty. An unreachable Sanity API is fine: builds fall back to defaults.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@tylerlirette"

      # Installs @tylerlirette/pagebuilder from GitHub Packages. Needs a classic token
      # with read:packages stored as the repository secret NODE_AUTH_TOKEN.
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
